<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLOG PARA LA DIVULGACION DEL CONOCIMIENTO</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0b0f17;color:#e9eefc;}
header{background:#111a2a;padding:18px;border-bottom:1px solid rgba(255,255,255,.1);}
.wrap{max-width:1100px;margin:auto;}
.topbar{display:flex;align-items:center;justify-content:space-between;}
.logo{width:60px;height:60px;border-radius:10px;}
.brand h1{margin:0;font-size:18px;}
.counter{margin-top:12px;padding:10px 14px;background:#0f1726;border-radius:10px;font-weight:700;display:inline-block;color:#7aa2ff;}
.controls{margin-top:18px;display:grid;grid-template-columns:1fr 200px 200px auto;gap:10px;}
input,select{padding:10px;border-radius:8px;border:none;background:#0f1726;color:white;}
button{padding:10px 14px;border:none;border-radius:8px;background:#7aa2ff;color:white;font-weight:bold;cursor:pointer;}
.grid{margin-top:25px;display:grid;gap:14px;}
.card{background:#111a2a;padding:16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(255,255,255,0.05);}
.title{font-size:16px;font-weight:700;margin:0;max-width: 80%;}
.meta{margin-top:8px;display:flex;gap:8px;}
.chip{background:rgba(122,162,255,.1);padding:4px 10px;border-radius:30px;font-size:12px;color:#a9b6d6;}
a.btn{background:#7aa2ff;padding:10px 16px;border-radius:8px;text-decoration:none;color:white;font-weight:700;font-size:13px;transition: 0.2s;}
a.btn:hover{background:#5a86ff;}

/* Responsivo para móviles */
@media (max-width: 768px) {
    .controls { grid-template-columns: 1fr; }
    .card { flex-direction: column; align-items: flex-start; gap: 15px; }
    .title { max-width: 100%; }
}
</style>
</head>
<body>

<header>
<div class="wrap">
<div class="topbar">
<div class="brand">
<h1>BLOG PARA LA DIVULGACION DEL CONOCIMIENTO<br>JOSÉ MARÍA PÉREZ QUINTANA</h1>
</div>
<img src="LOGO.png" class="logo" alt="Logo">
</div>
<div class="counter">📊 Visitas totales: <span id="visitCount">Cargando...</span></div>
<div class="controls">
<input id="q" placeholder="Buscar por título o tema...">
<select id="tema"><option value="">Todos los temas</option></select>
<select id="orden">
<option value="az">Título A-Z</option>
<option value="za">Título Z-A</option>
</select>
<button id="recargar">🔄 Actualizar</button>
</div>
</div>
</header>

<main>
<div class="wrap"><div id="grid" class="grid"></div></div>
</main>

<script>
const SUPABASE_URL="https://isddztpzmmlxdqfzzmqb.supabase.co"
const SUPABASE_KEY="sb_publishable_3QxkThHs182AsPNnyPgZ9A_Vt0k4ssX"
const JSON_FILE="articulos.json"

let allArticles=[];
function $(id){return document.getElementById(id)}

// Obtener contador de Supabase
async function fetchCounters(){
    try{
        let res=await fetch(`${SUPABASE_URL}/rest/v1/contadores?select=id,valor`,{
            headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}
        });
        let data=await res.json();
        let c = data.find(item => item.id === "visitas_totales");
        if(c) $("visitCount").textContent = Number(c.valor).toLocaleString("es-ES");
    }catch(e){ $("visitCount").textContent="--"; }
}

// Sumar visita (con keepalive para asegurar el registro al saltar de página)
async function increment(){
    try{
        await fetch(`${SUPABASE_URL}/rest/v1/rpc/incrementar_contador`,{
            method:"POST",
            headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,"Content-Type":"application/json"},
            body:JSON.stringify({row_id:"visitas_totales"}),
            keepalive: true 
        });
    }catch(e){ console.error("Error incrementando:", e); }
}

// Adaptar los datos de tu JSON (Mayúsculas TITULO y URL)
function normalize(a){
    return {
        titulo: (a.TITULO || "Sin título").trim(),
        url: (a.URL || "#").trim(),
        tema: (a.TEMA || "General").trim()
    };
}

function render(){
    let q = $("q").value.toLowerCase();
    let tema = $("tema").value;
    
    let lista = allArticles.filter(a => {
        if(tema && a.tema !== tema) return false;
        let busqueda = (a.titulo + " " + a.tema).toLowerCase();
        return q ? busqueda.includes(q) : true;
    });

    let orden = $("orden").value;
    lista.sort((a,b) => {
        return orden === "az" ? a.titulo.localeCompare(b.titulo) : b.titulo.localeCompare(a.titulo);
    });

    $("grid").innerHTML = lista.map(a => `
        <div class="card">
            <div>
                <h3 class="title">${a.titulo}</h3>
                <div class="meta">
                    <span class="chip">${a.tema}</span>
                </div>
            </div>
            <a class="btn" href="${a.url}" target="_blank" onclick="increment()">Leer Artículo</a>
        </div>
    `).join("");
}

async function init(){
    fetchCounters(); // Mostrar contador actual
    increment();     // Contar visita a la web principal
    
    try {
        let res = await fetch(JSON_FILE + "?v=" + Date.now());
        let data = await res.json();
        allArticles = data.map(normalize);
        
        // Cargar temas únicos en el selector
        let temas = [...new Set(allArticles.map(a => a.tema))].sort();
        $("tema").innerHTML = '<option value="">Todos los temas</option>' + 
                              temas.map(t => `<option value="${t}">${t}</option>`).join("");
        
        render();
    } catch(e) {
        console.error("Error cargando JSON:", e);
        $("grid").innerHTML = "<p style='text-align:center'>Error al cargar los artículos. Revisa el archivo JSON.</p>";
    }
}

$("q").addEventListener("input", render);
$("tema").addEventListener("change", render);
$("orden").addEventListener("change", render);
$("recargar").addEventListener("click", () => { location.reload(); });

init();
</script>
</body>
</html>
