<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>BLOG PARA LA DIVULGACION DEL CONOCIMIENTO</title>

<style>

body{
background:#0b0f17;
color:white;
font-family:Arial;
margin:0;
}

header{
background:#111a2a;
padding:20px;
border-bottom:1px solid #333;
display:flex;
align-items:center;
gap:20px;
}

header img{
height:60px;
}

header h1{
margin:0;
font-size:26px;
}

.controls{
padding:15px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

input,select,button{
padding:8px;
border-radius:6px;
border:none;
}

.grid{
padding:20px;
display:grid;
gap:12px;
}

.card{
background:#111a2a;
padding:15px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.title{
font-weight:bold;
font-size:16px;
}

.meta{
font-size:12px;
color:#aaa;
margin-top:6px;
}

a{
color:#7aa2ff;
text-decoration:none;
}

</style>

</head>

<body>

<header>

<img src="LOGO.png">

<h1>BLOG PARA LA DIVULGACION DEL CONOCIMIENTO</h1>

</header>

<div class="controls">

<input id="q" placeholder="Buscar">

<select id="tema">
<option value="">Todos</option>
</select>

<select id="orden">
<option value="fecha_desc">Fecha nueva</option>
<option value="fecha_asc">Fecha antigua</option>
<option value="az">Título A-Z</option>
<option value="za">Título Z-A</option>
</select>

<button onclick="init()">Recargar</button>

</div>

<div id="grid" class="grid"></div>

<script>

const JSON_FILE="articulos.json"

let allArticles=[]


function normalizeArticle(a){

let titulo=""
let url=""
let fecha=null
let tema="Otros"


// TITULO

if(a.nombre){

let p=a.nombre.split("|")

if(p.length>1){

titulo=p[1].trim()

}else{

titulo=a.nombre.trim()

}

}


// URL + FECHA

if(a.url){

let p=a.url.split("|")

url=p[0].trim()

if(p.length>2){

fecha=new Date(p[2].trim())

}

}


// TEMA

if(a.tema && a.tema.trim()!=""){

tema=a.tema.trim()

}


return{

titulo,
url,
fecha,
tema

}

}



function render(){

let q=document.getElementById("q").value.toLowerCase()

let tema=document.getElementById("tema").value


let lista=allArticles.filter(a=>{

if(tema && a.tema!==tema) return false

if(q){

let s=(a.titulo+" "+a.tema).toLowerCase()

if(!s.includes(q)) return false

}

return true

})


let orden=document.getElementById("orden").value


lista.sort((a,b)=>{

if(orden==="fecha_desc") return b.fecha-a.fecha
if(orden==="fecha_asc") return a.fecha-b.fecha
if(orden==="az") return a.titulo.localeCompare(b.titulo)
if(orden==="za") return b.titulo.localeCompare(a.titulo)

})


let html=""

lista.forEach(a=>{

let fechaTexto=""

if(a.fecha){

fechaTexto=a.fecha.toISOString().split("T")[0]

}

html+=`

<div class="card">

<div>

<div class="title">${a.titulo}</div>

<div class="meta">

${a.tema} • ${fechaTexto}

</div>

</div>

<div>

<a href="${a.url}" target="_blank">Leer</a>

</div>

</div>

`

})

document.getElementById("grid").innerHTML=html

}



async function init(){

let res=await fetch(JSON_FILE+"?"+Date.now())

let data=await res.json()

allArticles=data.map(normalizeArticle)



// CREAR LISTA DE TEMAS

let temas=[...new Set(allArticles.map(a=>a.tema))]

temas=temas.sort()



let select=document.getElementById("tema")

select.innerHTML='<option value="">Todos</option>'


temas.forEach(t=>{

select.innerHTML+=`<option value="${t}">${t}</option>`

})


render()

}



document.getElementById("q").addEventListener("input",render)

document.getElementById("tema").addEventListener("change",render)

document.getElementById("orden").addEventListener("change",render)



init()

</script>

</body>
</html>
