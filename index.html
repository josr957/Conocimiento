<!doctype html>
<html lang="es">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BLOG PARA LA DIVULGACION DEL CONOCIMIENTO</title>

<style>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#0b0f17;
color:#e9eefc;
}

header{
background:#111a2a;
padding:18px;
border-bottom:1px solid rgba(255,255,255,.1);
}

.wrap{
max-width:1100px;
margin:auto;
}

.topbar{
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
width:60px;
height:60px;
border-radius:10px;
}

.brand h1{
margin:0;
font-size:20px;
}

.counter{
margin-top:12px;
padding:10px 14px;
background:#0f1726;
border-radius:10px;
font-weight:700;
display:inline-block;
}

.controls{
margin-top:18px;
display:grid;
grid-template-columns:1fr 200px 200px;
gap:10px;
}

input,select{
padding:10px;
border-radius:8px;
border:none;
background:#0f1726;
color:white;
}

.grid{
margin-top:25px;
display:grid;
gap:14px;
}

.card{
background:#111a2a;
padding:16px;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
}

.title{
font-size:16px;
font-weight:800;
margin:0;
}

.meta{
margin-top:8px;
display:flex;
gap:8px;
}

.chip{
background:rgba(122,162,255,.14);
padding:4px 10px;
border-radius:30px;
font-size:12px;
color:#a9b6d6;
}

a.btn{
background:#7aa2ff;
padding:10px 12px;
border-radius:8px;
text-decoration:none;
color:white;
font-weight:700;
font-size:13px;
}

</style>

</head>

<body>

<header>

<div class="wrap">

<div class="topbar">

<div class="brand">
<h1>BLOG PARA LA DIVULGACION DEL CONOCIMIENTO
     JOSÉ MARÍA PÉREZ QUINTANA</h1>
</div>

<img src="LOGO.png" class="logo">

</div>

<div class="counter">
📊 Visitas totales del blog: <span id="visitCount">...</span>
</div>

<div class="controls">

<input id="q" placeholder="Buscar artículo">

<select id="tema">
<option value="">Todos los temas</option>
</select>

<select id="orden">
<option value="fecha_desc">Fecha nueva</option>
<option value="fecha_asc">Fecha antigua</option>
<option value="az">Título A-Z</option>
<option value="za">Título Z-A</option>
</select>

</div>

</div>

</header>

<main>

<div class="wrap">

<div id="grid" class="grid"></div>

</div>

</main>

<script>

const SUPABASE_URL="https://isddztpzmmlxdqfzzmqb.supabase.co"
const SUPABASE_KEY="sb_publishable_3QxkThHs182AsPNnyPgZ9A_Vt0k4ssX"

// IMPORTANTE: Usar el mismo ID que configuraste en Supabase
const CONTADOR_ID = "1780948"  // ← CORREGIDO: ahora usa el ID correcto

const JSON_FILE="articulos.json"

let allArticles=[]

function $(id){return document.getElementById(id)}

// Función para obtener el contador actual de Supabase
async function fetchCounters(){
    try{
        let res=await fetch(`${SUPABASE_URL}/rest/v1/contadores?select=id,valor&id=eq.${CONTADOR_ID}`,{
            headers:{
                apikey:SUPABASE_KEY,
                Authorization:`Bearer ${SUPABASE_KEY}`
            }
        })

        if(!res.ok){
            throw new Error(`Error HTTP: ${res.status}`)
        }

        let data=await res.json()

        if(data && data.length > 0){
            const valorActual = Number(data[0].valor)
            $("visitCount").textContent = valorActual.toLocaleString("es-ES")
            console.log(`📊 Contador cargado: ${valorActual}`)
        } else {
            $("visitCount").textContent = "0"
            console.log("📊 Contador no encontrado, usando 0")
        }

    }catch(e){
        console.error("Error al cargar contador:", e)
        $("visitCount").textContent = "0"
    }
}

// Función para incrementar el contador en Supabase
async function increment(){
    try{
        console.log(`🔄 Incrementando contador con ID: ${CONTADOR_ID}`)
        
        const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/incrementar_contador`,{
            method:"POST",
            headers:{
                apikey:SUPABASE_KEY,
                Authorization:`Bearer ${SUPABASE_KEY}`,
                "Content-Type":"application/json"
            },
            body:JSON.stringify({id_registro: CONTADOR_ID})  // ← CORREGIDO: usa el parámetro correcto "id_registro"
        })

        if(!response.ok){
            const errorText = await response.text()
            throw new Error(`Error al incrementar: ${response.status} - ${errorText}`)
        }

        console.log("✅ Contador incrementado correctamente")
        
        // Esperar un momento y recargar el valor actualizado
        setTimeout(() => fetchCounters(), 500)
        
        return true

    }catch(e){
        console.error("❌ Error al incrementar contador:", e)
        return false
    }
}

function parseDate(s){
    if(!s)return null
    let p=s.split("-")
    if(p.length!==3)return null
    return new Date(p[0],p[1]-1,p[2])
}

function normalize(a){
    let pN=(a.nombre||"").split("|")
    let pU=(a.url||"").split("|")
    
    let titulo=(pN[1]||pU[1]||pN[0]||"Sin título").trim()
    let url=(pU[0]||"").trim()
    let fecha=(pU[2]||pN[2]||"").trim()
    
    return{
        titulo,
        url,
        fecha,
        tema:(a.tema||"").trim(),
        date:parseDate(fecha)
    }
}

function escapeHtml(str){
    if(!str) return ""
    return str.replace(/[&<>]/g, function(m){
        if(m === "&") return "&amp;"
        if(m === "<") return "&lt;"
        if(m === ">") return "&gt;"
        return m
    })
}

function render(){
    let q=$("q").value.toLowerCase()
    let tema=$("tema").value
    
    let lista=allArticles.filter(a=>{
        if(tema && a.tema!==tema)return false
        let s=(a.titulo+" "+a.tema+" "+a.fecha).toLowerCase()
        if(q && !s.includes(q))return false
        return true
    })
    
    let orden=$("orden").value
    
    lista.sort((a,b)=>{
        if(orden==="fecha_desc")return (b.date||0)-(a.date||0)
        if(orden==="fecha_asc")return (a.date||0)-(b.date||0)
        if(orden==="az")return a.titulo.localeCompare(b.titulo)
        if(orden==="za")return b.titulo.localeCompare(a.titulo)
        return 0
    })
    
    $("grid").innerHTML=lista.map(a=>`
        <div class="card">
            <div>
                <h3 class="title">${escapeHtml(a.titulo)}</h3>
                <div class="meta">
                    ${a.tema?`<span class="chip">${escapeHtml(a.tema)}</span>`:""}
                    ${a.fecha?`<span class="chip">${escapeHtml(a.fecha)}</span>`:""}
                </div>
            </div>
            <a class="btn open-article" href="${escapeHtml(a.url)}" target="_blank">Leer</a>
        </div>
    `).join("")
}

async function init(){
    console.log("🚀 Iniciando aplicación...")
    console.log(`🔑 Usando Contador ID: ${CONTADOR_ID}`)
    
    // Cargar el contador actual desde Supabase
    await fetchCounters()
    
    // Incrementar la visita a la página principal
    await increment()
    
    // Cargar los artículos
    try{
        let res=await fetch(JSON_FILE+"?v="+Date.now())
        
        if(!res.ok){
            throw new Error(`Error al cargar artículos: ${res.status}`)
        }
        
        let data=await res.json()
        
        allArticles=data.map(normalize)
        
        let temas=[...new Set(allArticles.map(a=>a.tema).filter(Boolean))].sort()
        
        $("tema").innerHTML='<option value="">Todos los temas</option>'+temas.map(t=>`<option>${escapeHtml(t)}</option>`).join("")
        
        render()
        
        console.log(`✅ Cargados ${allArticles.length} artículos`)
        
    }catch(e){
        console.error("❌ Error al cargar artículos:", e)
        $("grid").innerHTML='<div class="card" style="justify-content:center;">Error al cargar los artículos. Verifica que el archivo articulos.json existe.</div>'
    }
}

// Event listeners
$("q").addEventListener("input",render)
$("tema").addEventListener("change",render)
$("orden").addEventListener("change",render)

// Al hacer clic en un artículo, incrementamos el contador
$("grid").addEventListener("click", async function(e){
    const link = e.target.closest("a.open-article")
    if(!link) return
    
    // Incrementar contador al abrir artículo
    await increment()
})

// Iniciar la aplicación
init()

</script>

</body>
</html>
