<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Índice del Blog</title>

<style>
body{
background:#0b0f17;
color:white;
font-family:Arial;
margin:0;
}

header{
padding:20px;
background:#111a2a;
border-bottom:1px solid #333;
}

h1{
margin:0;
font-size:18px;
}

.controls{
display:flex;
gap:10px;
padding:15px;
flex-wrap:wrap;
}

input,select,button{
padding:8px;
border-radius:6px;
border:none;
}

.grid{
padding:20px;
display:grid;
gap:12px;
}

.card{
background:#111a2a;
padding:15px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.title{
font-size:16px;
font-weight:bold;
}

.meta{
font-size:12px;
color:#aaa;
margin-top:6px;
}

a{
color:#7aa2ff;
text-decoration:none;
}
</style>

</head>

<body>

<header>
<h1>Indice del Blog</h1>
</header>

<div class="controls">

<input id="q" placeholder="Buscar">

<select id="tema">
<option value="">Todos</option>
</select>

<select id="orden">
<option value="fecha_desc">Fecha nueva</option>
<option value="fecha_asc">Fecha antigua</option>
<option value="az">Titulo A-Z</option>
<option value="za">Titulo Z-A</option>
</select>

<button id="recargar">Recargar</button>
<button id="limpiar">Limpiar</button>

</div>

<div class="grid" id="grid"></div>

<script>

const JSON_FILE="articulos.json";

let allArticles=[];

function detectarTema(titulo){

titulo=titulo.toLowerCase();

if(titulo.includes("fisica") ||
titulo.includes("cuantica") ||
titulo.includes("universo") ||
titulo.includes("neutrino"))
return "Ciencia";

if(titulo.includes("ia") ||
titulo.includes("robot") ||
titulo.includes("algoritmo") ||
titulo.includes("computacion"))
return "Tecnologia";

if(titulo.includes("imperio") ||
titulo.includes("historia") ||
titulo.includes("batalla"))
return "Historia";

if(titulo.includes("guerra") ||
titulo.includes("geopolitica"))
return "Geopolitica";

if(titulo.includes("etica") ||
titulo.includes("filosofia") ||
titulo.includes("conciencia"))
return "Filosofia";

return "Misterios";
}

function parseFechaDesdeURL(url){

let partes=url.split("|");

if(partes.length<3) return null;

let fecha=partes[2].trim();

let p=fecha.split("-");

return new Date(p[0],p[1]-1,p[2]);
}

function normalizeArticle(a){

let titulo="";

if(a.nombre){
let parts=a.nombre.split("|");
titulo=parts[1].trim();
}

let url="";

if(a.url){
let parts=a.url.split("|");
url=parts[0].trim();
}

let fecha=parseFechaDesdeURL(a.url);

let tema=detectarTema(titulo);

return{
titulo,
url,
tema,
fecha
};

}

function render(){

let q=document.getElementById("q").value.toLowerCase();
let t=document.getElementById("tema").value;

let lista=allArticles.filter(a=>{

if(t && a.tema!=t) return false;

if(q){
let s=(a.titulo+" "+a.tema).toLowerCase();
if(!s.includes(q)) return false;
}

return true;

});

let modo=document.getElementById("orden").value;

lista.sort((a,b)=>{

if(modo=="fecha_desc")
return b.fecha-a.fecha;

if(modo=="fecha_asc")
return a.fecha-b.fecha;

if(modo=="az")
return a.titulo.localeCompare(b.titulo);

if(modo=="za")
return b.titulo.localeCompare(a.titulo);

});

let html="";

lista.forEach(a=>{

html+=`
<div class="card">

<div>

<div class="title">${a.titulo}</div>

<div class="meta">
${a.tema}
</div>

</div>

<div>
<a href="${a.url}" target="_blank">Leer</a>
</div>

</div>
`;

});

document.getElementById("grid").innerHTML=html;

}

async function init(){

let res=await fetch(JSON_FILE+"?"+Date.now());

let data=await res.json();

allArticles=data.map(normalizeArticle);

let temas=[...new Set(allArticles.map(a=>a.tema))].sort();

let select=document.getElementById("tema");

select.innerHTML='<option value="">Todos</option>';

temas.forEach(t=>{
select.innerHTML+=`<option value="${t}">${t}</option>`;
});

render();

}

document.getElementById("q").addEventListener("input",render);
document.getElementById("tema").addEventListener("change",render);
document.getElementById("orden").addEventListener("change",render);

document.getElementById("recargar").addEventListener("click",init);

document.getElementById("limpiar").addEventListener("click",()=>{
document.getElementById("q").value="";
document.getElementById("tema").value="";
render();
});

init();

</script>

</body>
</html>
